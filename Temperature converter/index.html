<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="container">
      <form id="converterForm">
        <h1>Temperature Converter</h1>

        <label for="temperature">Enter temperature</label>
        <input
          type="number"
          id="temperature"
          class="value"
          placeholder="e.g. 25"
          step="any"
          required
        />

        <div class="choose">
          <label>
            <input
              type="radio"
              name="conversion"
              value="toFahrenheit"
              checked
            />
            Celsius → Fahrenheit
          </label>

          <label>
            <input type="radio" name="conversion" value="toCelsius" />
            Fahrenheit → Celsius
          </label>
        </div>

        <button type="submit" id="submitBtn">Convert</button>

        <h2 class="result" aria-live="polite">Enter a value to convert</h2>
      </form>
    </main>

    <script src="script.js"></script>
  </body>
</html>
