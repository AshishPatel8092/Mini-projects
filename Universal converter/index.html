<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Converter & Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navigation / Header -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand">
          <div class="brand-icon">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"
              />
            </svg>
          </div>
          <div class="brand-info">
            <h1>Universal Converter</h1>
            <p>Essential Conversion & Calculation Tools</p>
          </div>
        </div>

        <button
          id="themeToggleBtn"
          type="button"
          class="theme-toggle"
          aria-label="Toggle Theme"
        >
          <span class="theme-icon" id="themeIcon">☀️</span>
          <span id="themeLabel">Light Mode</span>
        </button>
      </div>
    </header>

    <!-- Main Grid Section -->
    <main class="main-wrapper">
      <div id="gridContainer" class="converter-grid">
        <!-- Dynamic cards and expandable panels rendered by script.js -->
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
