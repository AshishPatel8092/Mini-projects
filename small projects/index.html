<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal Converter</title>
    <!-- Lucide Icons Library for Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Complete CSS Embedded -->
    <style>
      /* Global Reset & Theme CSS Variables */
      :root {
        --bg-color: #0d0e12;
        --header-bg: rgba(18, 19, 25, 0.85);
        --card-bg: #14151b;
        --card-hover-bg: #1a1c24;
        --card-active-bg: #004b6e;
        --card-active-border: #00608a;
        --border-color: #22242f;
        --panel-bg: #14151b;
        --input-bg: #1d1e26;
        --input-border: #2a2c38;
        --text-main: #f1f5f9;
        --text-muted: #94a3b8;
        --accent-orange: #f97316;
        --accent-teal: #0d9488;
        --icon-box-bg: #1e202b;
      }

      /* Light Theme Variables */
      html.light {
        --bg-color: #f8fafc;
        --header-bg: rgba(255, 255, 255, 0.85);
        --card-bg: #ffffff;
        --card-hover-bg: #f1f5f9;
        --card-active-bg: #0d9488;
        --card-active-border: #0f766e;
        --border-color: #e2e8f0;
        --panel-bg: #ffffff;
        --input-bg: #f1f5f9;
        --input-border: #cbd5e1;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --accent-orange: #d97706;
        --accent-teal: #0f766e;
        --icon-box-bg: #ccfbf1;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-main);
        min-height: 100vh;
        transition:
          background-color 0.3s ease,
          color 0.3s ease;
      }

      /* Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-color);
        border-radius: 4px;
      }

      /* Header */
      .app-header {
        border-bottom: 1px solid var(--border-color);
        background-color: var(--header-bg);
        backdrop-filter: blur(10px);
        position: sticky;
        top: 0;
        z-index: 50;
      }

      .header-container {
        max-width: 1150px;
        margin: 0 auto;
        padding: 0 20px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-icon {
        padding: 8px;
        border-radius: 12px;
        background-color: rgba(249, 115, 22, 0.1);
        color: var(--accent-orange);
        border: 1px solid rgba(249, 115, 22, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-text h1 {
        font-size: 1rem;
        font-weight: 800;
        letter-spacing: -0.02em;
      }

      .brand-text p {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .theme-btn {
        padding: 6px 14px;
        border-radius: 10px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-main);
        font-size: 0.75rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .theme-btn:hover {
        background-color: var(--card-hover-bg);
      }

      /* Main Container & Grid */
      .main-container {
        max-width: 1150px;
        margin: 0 auto;
        padding: 24px 20px 48px 20px;
      }

      .category-grid {
        display: grid;
        grid-template-columns: repeat(1, 1fr);
        gap: 16px;
      }

      @media (min-width: 640px) {
        .category-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (min-width: 900px) {
        .category-grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Cards */
      .card-btn {
        width: 100%;
        text-align: left;
        padding: 18px;
        border-radius: 16px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-main);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 128px;
        transition: all 0.2s ease;
      }

      .card-btn:hover {
        background-color: var(--card-hover-bg);
      }

      .card-btn.active {
        background-color: var(--card-active-bg);
        border-color: var(--card-active-border);
        color: #ffffff;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .card-icon-box {
        padding: 10px;
        border-radius: 10px;
        background-color: var(--icon-box-bg);
        color: var(--accent-orange);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .card-btn.active .card-icon-box {
        background-color: rgba(255, 255, 255, 0.15);
        color: #ffffff;
      }

      .card-title {
        font-size: 0.95rem;
        font-weight: 700;
      }

      .card-desc {
        font-size: 0.75rem;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 4px;
      }

      .card-btn.active .card-desc {
        color: rgba(255, 255, 255, 0.85);
      }

      /* In-Row Expansion Panel */
      .expanded-panel-wrapper {
        grid-column: 1 / -1;
        margin: 8px 0;
      }

      .expanded-panel {
        padding: 24px;
        border-radius: 20px;
        border: 1px solid var(--border-color);
        background-color: var(--panel-bg);
        color: var(--text-main);
        box-shadow: 0 20px 30px -10px rgba(0, 0, 0, 0.3);
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        margin-bottom: 20px;
        border-bottom: 1px solid var(--border-color);
      }

      .panel-title-box {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .panel-title-box h2 {
        font-size: 1.15rem;
        font-weight: 800;
      }

      .panel-title-box p {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      .close-btn {
        padding: 8px;
        border-radius: 10px;
        border: none;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .close-btn:hover {
        background-color: var(--border-color);
        color: var(--text-main);
      }

      /* Form Controls */
      .converter-form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      @media (min-width: 640px) {
        .converter-form-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      .input-box {
        padding: 16px;
        border-radius: 14px;
        border: 1px solid var(--input-border);
        background-color: var(--input-bg);
      }

      .input-label {
        display: block;
        font-size: 0.75rem;
        font-weight: 600;
        color: var(--text-muted);
        margin-bottom: 8px;
      }

      .custom-input {
        width: 100%;
        font-size: 1.5rem;
        font-weight: 700;
        background: transparent;
        border: none;
        outline: none;
        color: var(--text-main);
      }

      .result-card {
        padding: 16px;
        border-radius: 14px;
        border: 1px solid var(--input-border);
        background-color: var(--input-bg);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
      }

      .result-value {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--accent-orange);
      }

      /* Remove number arrows */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        appearance: textfield;
      }
    </style>
  </head>
  <body>
    <!-- App Header -->
    <header class="app-header">
      <div class="header-container">
        <div class="brand">
          <div class="brand-icon">
            <i data-lucide="sparkles"></i>
          </div>
          <div class="brand-text">
            <h1>Universal Converter</h1>
            <p>15 Essential Conversion & Calculation Tools</p>
          </div>
        </div>

        <!-- Theme Toggle -->
        <button id="themeToggleBtn" type="button" class="theme-btn">
          <i data-lucide="sun"></i>
          <span id="themeBtnText">Light Mode</span>
        </button>
      </div>
    </header>

    <!-- Main Content Grid -->
    <main class="main-container">
      <div id="categoryGrid" class="category-grid">
        <!-- Grid items injected dynamically -->
      </div>
    </main>

    <!-- JavaScript Logic -->
    <script>
      const CATEGORIES = [
        {
          id: "currency",
          name: "Currency",
          icon: "coins",
          desc: "Convert global currencies with live rates.",
        },
        {
          id: "length",
          name: "Length",
          icon: "ruler",
          desc: "Convert metric, imperial, and nautical distance.",
        },
        {
          id: "mass",
          name: "Mass",
          icon: "scale",
          desc: "Convert kilograms, pounds, ounces, grams, tons.",
        },
        {
          id: "area",
          name: "Area",
          icon: "maximize-2",
          desc: "Calculate sq meters, acres, hectares, sq ft.",
        },
        {
          id: "time",
          name: "Time",
          icon: "clock",
          desc: "Convert seconds, hours, days, weeks, years.",
        },
        {
          id: "finance",
          name: "Finance",
          icon: "dollar-sign",
          desc: "Calculate Loan EMI, Interest, Tips, Margins.",
        },
        {
          id: "data",
          name: "Data Storage",
          icon: "database",
          desc: "Convert bytes, KB, MB, GB, TB, and PB.",
        },
        {
          id: "date",
          name: "Date Calculator",
          icon: "calendar",
          desc: "Calculate date differences and days.",
        },
        {
          id: "discount",
          name: "Discount",
          icon: "tag",
          desc: "Calculate sale price, total savings, and discount.",
        },
        {
          id: "volume",
          name: "Volume",
          icon: "box",
          desc: "Convert liters, milliliters, gallons, cubic meters.",
        },
        {
          id: "numbersystem",
          name: "Number System",
          icon: "binary",
          desc: "Convert Binary, Octal, Decimal, and Hex.",
        },
        {
          id: "speed",
          name: "Speed",
          icon: "gauge",
          desc: "Convert km/h, mph, m/s, knots, ft/s.",
        },
        {
          id: "temperature",
          name: "Temperature",
          icon: "thermometer",
          desc: "Convert Celsius, Fahrenheit, Kelvin, Rankine.",
        },
        {
          id: "bmi",
          name: "BMI Calculator",
          icon: "activity",
          desc: "Calculate Body Mass Index & health range.",
        },
        {
          id: "gst",
          name: "GST / VAT",
          icon: "receipt",
          desc: "Calculate Exclusive and Inclusive tax.",
        },
      ];

      let activeCategoryId = "currency";

      function getColumnCount() {
        const w = window.innerWidth;
        if (w < 640) return 1;
        if (w < 900) return 2;
        return 3;
      }

      function renderGrid() {
        const grid = document.getElementById("categoryGrid");
        if (!grid) return;
        grid.innerHTML = "";

        const cols = getColumnCount();
        const activeIndex = CATEGORIES.findIndex(
          (c) => c.id === activeCategoryId,
        );
        let insertAfterIndex = -1;

        if (activeIndex !== -1) {
          const rowNumber = Math.floor(activeIndex / cols);
          insertAfterIndex = Math.min(
            (rowNumber + 1) * cols - 1,
            CATEGORIES.length - 1,
          );
        }

        CATEGORIES.forEach((cat, idx) => {
          const isActive = cat.id === activeCategoryId;

          const cardBtn = document.createElement("button");
          cardBtn.type = "button";
          cardBtn.className = `card-btn ${isActive ? "active" : ""}`;

          cardBtn.onclick = () => {
            activeCategoryId = activeCategoryId === cat.id ? null : cat.id;
            renderGrid();
          };

          cardBtn.innerHTML = `
          <div class="card-header">
            <div class="card-icon-box">
              <i data-lucide="${cat.icon}"></i>
            </div>
            <i data-lucide="${isActive ? "chevron-up" : "chevron-down"}"></i>
          </div>
          <div>
            <div class="card-title">${cat.name}</div>
            <div class="card-desc">${cat.desc}</div>
          </div>
        `;

          grid.appendChild(cardBtn);

          // Row expansion panel
          if (idx === insertAfterIndex && activeCategoryId) {
            const activeCat = CATEGORIES.find((c) => c.id === activeCategoryId);
            const panelWrapper = document.createElement("div");
            panelWrapper.className = "expanded-panel-wrapper";
            panelWrapper.innerHTML = `
            <div class="expanded-panel">
              <div class="panel-header">
                <div class="panel-title-box">
                  <div class="card-icon-box">
                    <i data-lucide="${activeCat.icon}"></i>
                  </div>
                  <div>
                    <h2>${activeCat.name} Converter</h2>
                    <p>${activeCat.desc}</p>
                  </div>
                </div>
                <button onclick="closePanel()" class="close-btn" type="button">
                  <i data-lucide="x"></i>
                </button>
              </div>
              <div>${getConverterUI(activeCat.id)}</div>
            </div>
          `;
            grid.appendChild(panelWrapper);
          }
        });

        if (typeof lucide !== "undefined" && lucide.createIcons) {
          lucide.createIcons();
        }
      }

      function closePanel() {
        activeCategoryId = null;
        renderGrid();
      }

      function getConverterUI(id) {
        if (id === "temperature") {
          return `
          <div class="converter-form-grid">
            <div class="input-box">
              <label class="input-label">Celsius (°C)</label>
              <input type="number" id="tempC" value="25" oninput="convertTemp('C')" class="custom-input" />
            </div>
            <div class="input-box">
              <label class="input-label">Fahrenheit (°F)</label>
              <input type="number" id="tempF" value="77" oninput="convertTemp('F')" class="custom-input" style="color: var(--accent-orange);" />
            </div>
          </div>
        `;
        }
        if (id === "gst") {
          return `
          <div class="converter-form-grid">
            <div class="input-box">
              <label class="input-label">Amount (₹)</label>
              <input type="number" id="gstAmt" value="1000" oninput="calcGST()" class="custom-input" />
            </div>
            <div class="input-box">
              <label class="input-label">GST Rate (%)</label>
              <input type="number" id="gstRate" value="18" oninput="calcGST()" class="custom-input" />
            </div>
          </div>
          <div class="result-card">
            <span class="input-label" style="margin:0;">Total Amount with GST:</span>
            <span id="gstTotal" class="result-value">₹1180.00</span>
          </div>
        `;
        }
        if (id === "discount") {
          return `
          <div class="converter-form-grid">
            <div class="input-box">
              <label class="input-label">Original Price ($)</label>
              <input type="number" id="discPrice" value="100" oninput="calcDiscount()" class="custom-input" />
            </div>
            <div class="input-box">
              <label class="input-label">Discount (%)</label>
              <input type="number" id="discRate" value="20" oninput="calcDiscount()" class="custom-input" />
            </div>
          </div>
          <div class="result-card">
            <span class="input-label" style="margin:0;">Final Price After Discount:</span>
            <span id="discResult" class="result-value">$80.00</span>
          </div>
        `;
        }
        return `
        <div style="text-align: center; color: var(--text-muted); padding: 24px;">
          Interactive converter module active for <strong>${id}</strong>.
        </div>
      `;
      }

      function convertTemp(source) {
        const c = document.getElementById("tempC");
        const f = document.getElementById("tempF");
        if (source === "C") {
          const val = parseFloat(c.value) || 0;
          f.value = ((val * 9) / 5 + 32).toFixed(1);
        } else {
          const val = parseFloat(f.value) || 0;
          c.value = (((val - 32) * 5) / 9).toFixed(1);
        }
      }

      function calcGST() {
        const amt = parseFloat(document.getElementById("gstAmt").value) || 0;
        const rate = parseFloat(document.getElementById("gstRate").value) || 0;
        const total = amt + (amt * rate) / 100;
        document.getElementById("gstTotal").innerText = `₹${total.toFixed(2)}`;
      }

      function calcDiscount() {
        const price =
          parseFloat(document.getElementById("discPrice").value) || 0;
        const rate = parseFloat(document.getElementById("discRate").value) || 0;
        const finalPrice = Math.max(0, price - (price * rate) / 100);
        document.getElementById("discResult").innerText =
          `$${finalPrice.toFixed(2)}`;
      }

      window.addEventListener("resize", renderGrid);
      document.addEventListener("DOMContentLoaded", () => {
        renderGrid();

        const themeBtn = document.getElementById("themeToggleBtn");
        const themeText = document.getElementById("themeBtnText");
        if (themeBtn) {
          themeBtn.onclick = () => {
            const isLight = document.documentElement.classList.toggle("light");
            themeText.innerText = isLight ? "Dark Mode" : "Light Mode";
          };
        }
      });
    </script>
  </body>
</html>
