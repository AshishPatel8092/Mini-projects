<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Random Password Generator</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="text">Generate a <br /><span>Random Password</span></h1>
      <div class="display">
        <input type="text" id="password" placeholder="password" />
        <span class="material-symbols-outlined" id="copyBtn">
          content_copy
        </span>
      </div>

      <button>
        <span class="material-symbols-outlined"> modeling </span>Generate
        Password
      </button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
