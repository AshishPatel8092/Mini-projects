<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cricket Game</title>
    <link rel="stylesheet" href="cricket.css" />
    <style>
      body {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Bat Ball Stump Game</h1>

    <button
      class="choice-button"
      onclick="
        let computerChoice = generateComputerChoice();
        let resultMsg = getResult('Bat', computerChoice);
        showResult('Bat', computerChoice, resultMsg);
      "
    >
      <img src="images/Bat.webp" alt="Bat Image" class="choice-image" />
    </button>
    <button
      class="choice-button"
      onclick="
        computerChoice = generateComputerChoice();
        resultMsg = getResult('Ball', computerChoice);

        showResult('Ball', computerChoice, resultMsg);
      "
    >
      <img src="images/Ball.webp" alt="Ball Image" class="choice-image" />
    </button>
    <button
      class="choice-button"
      onclick="
        computerChoice = generateComputerChoice();
        resultMsg = getResult('Stump', computerChoice);

        showResult('Stump', computerChoice, resultMsg);
      "
    >
      <img src="images/wicket.webp" alt="stump Image" class="choice-image" />
    </button>

    <div id="user-move"></div>
    <div id="computer-move"></div>
    <div id="result"></div>
    <div id="score"></div>

    <button
      onclick="
        localStorage.clear();
        resetScore(scoreStr);
      "
    >
      Reset
    </button>
    <script>
      let scoreStr = localStorage.getItem("Score");
      let score;

      resetScore(scoreStr); // ✅ correct function name

      function resetScore(scoreStr) {
        score = scoreStr
          ? JSON.parse(scoreStr)
          : {
              win: 0,
              lost: 0,
              tie: 0,
            };

        score.displayScore = function () {
          return `Score: Won:${this.win}, Lost:${this.lost}, Tie:${this.tie}`;
        };

        showResult();
      }

      function generateComputerChoice() {
        let randomNumber = Math.random() * 3;

        if (randomNumber <= 1) {
          return "Bat";
        } else if (randomNumber <= 2) {
          return "Ball";
        } else {
          return "Stump";
        }
      }

      function getResult(userMove, computerMove) {
        if (userMove === "Bat") {
          if (computerMove === "Ball") {
            score.win++;
            return "User won.";
          } else if (computerMove === "Bat") {
            score.tie++;
            return "It's a tie";
          } else {
            score.lost++;
            return "Computer has won";
          }
        }

        if (userMove === "Ball") {
          if (computerMove === "Ball") {
            score.tie++;
            return "It's a tie";
          } else if (computerMove === "Bat") {
            score.lost++;
            return "Computer has won";
          } else {
            score.win++;
            return "User won";
          }
        }

        if (userMove === "Stump") {
          if (computerMove === "Ball") {
            score.lost++;
            return "Computer has won";
          } else if (computerMove === "Bat") {
            score.win++;
            return "User won";
          } else {
            score.tie++;
            return "It's a tie";
          }
        }
      }

      function showResult(userMove, computerMove, result) {
        localStorage.setItem("Score", JSON.stringify(score));

        document.querySelector("#user-move").innerText = userMove
          ? `You chose ${userMove}`
          : "";

        document.querySelector("#computer-move").innerText = computerMove
          ? `Computer chose ${computerMove}`
          : "";

        document.querySelector("#result").innerText = result ? result : "";

        document.querySelector("#score").innerText = score.displayScore();
      }
    </script>
  </body>
</html>
